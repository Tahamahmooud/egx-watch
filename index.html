<style>
/* التخطيط: شريط حالة ثابت فوق قائمة أسهم كثيفة — الضغط على سهم يفتح تفاصيله */
:root{
  --bg:#f6f4ef; --surface:#fffefb; --surface-2:#efebe2; --line:#e0dacd;
  --fg:#1b1813; --dim:#6d6558; --accent:#9a6f10;
  --up:#0d7a4a; --down:#b6342a; --flat:#7a7264;
  --shadow:0 1px 2px rgba(40,32,16,.06),0 8px 24px rgba(40,32,16,.05);
  --f-ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1b1917; --surface-2:#24211d; --line:#2f2b25;
  --fg:#f1ece2; --dim:#9b9285; --accent:#d9ab4a;
  --up:#3ccf8e; --down:#ff6f61; --flat:#8c8478;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1b1917; --surface-2:#24211d; --line:#2f2b25;
  --fg:#f1ece2; --dim:#9b9285; --accent:#d9ab4a;
  --up:#3ccf8e; --down:#ff6f61; --flat:#8c8478;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);margin:0;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:0 16px;padding-block:0 32px}
[dir=rtl]{direction:rtl}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:12px 16px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--dim);font-family:var(--f-num)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--flat)}
.pill.open .dot{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 25%,transparent)}
.pill.shut .dot{background:var(--down)}
.spacer{flex:1}
button{font-family:inherit;font-size:13px;color:var(--fg);background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 72px auto;gap:12px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  cursor:pointer;text-align:start;width:100%;box-shadow:var(--shadow)}
.row:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.nm{min-width:0}
.tk{font-family:var(--f-num);font-size:13px;font-weight:600;color:var(--accent)}
.co{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;text-align:end}
.ch{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12px;text-align:end;display:block}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.spark{width:68px;height:30px;display:block}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;display:inline-block;margin-top:3px}
.t-buy{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.t-sell{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.t-mid{background:var(--surface-2);color:var(--dim)}
.t-strong{background:color-mix(in srgb,var(--up) 30%,transparent);color:var(--up);font-weight:700}
.t-warn{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:10px 0}
.plan .cell{border:1px solid var(--line)}
.px-entry b{color:var(--accent)} .px-stop b{color:var(--down)} .px-t b{color:var(--up)}
.bar-r{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:4px 0}
.bar-r .lb{min-width:96px}
.bar-r .vv{font-family:var(--f-num);color:var(--fg);font-weight:600;min-width:62px;text-align:end}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.chip{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--dim);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.note{font-size:12px;color:var(--dim);margin:14px 2px 0;line-height:1.7}
.skel{height:62px;border-radius:12px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);
  background-size:400% 100%;animation:sh 1.4s infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

dialog{border:none;padding:0;background:transparent;max-width:min(680px,100%);width:100%}
dialog::backdrop{background:rgba(10,8,4,.55)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;
  box-shadow:var(--shadow);max-height:88vh;overflow:auto}
.sh-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.big{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:16px 0}
.cell{background:var(--surface-2);border-radius:10px;padding:9px 11px;min-width:0}
.cell b{display:block;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;margin-top:2px}
.cell span{font-size:11px;color:var(--dim)}
.chart{width:100%;height:auto;display:block;margin:6px 0 2px}
.lg{display:flex;gap:14px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.lg i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-inline-end:4px}
h3{font-size:13px;font-weight:600;margin:18px 0 8px;color:var(--dim);letter-spacing:.02em}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2);margin:6px 0}
ul.pts{margin:0;padding-inline-start:18px;font-size:13px;line-height:1.8}
</style>

<script>
const WORKER = 'https://egx-data.tahamahm3.workers.dev';
/* وسيط عام اختياري: يعمل من المتصفح لغياب ترويسة CORS من الوسيط الأصلي */
const MIRROR = 'https://api.allorigins.win/raw?url=';
const buildURL = (tk) => {
  const q = `${WORKER}/${tk}.CA?range=1y&interval=1d&t=${Date.now()}`;
  return MIRROR + encodeURIComponent(q);
};

/* ---------- المصادر ----------
   مباشر (TradingView): سعر لحظي + RSI + المتوسطات، ومرسلة بترويسة CORS
   فبتشتغل من المتصفح على طول ومن غير أي وسيط.
   الوسيط على كلاودفلير: بيدّي تاريخ الجلسات للرسم البياني.        */
const TV = 'https://scanner.tradingview.com/symbol?symbol=EGX%3A';
const TV_FIELDS = 'close,change,change_abs,RSI,SMA20,SMA50,SMA200,volume,average_volume_10d_calc,'
                + 'price_52_week_high,price_52_week_low,description';

async function fromTV(tk){
  const r = await fetchT(`${TV}${tk}&fields=${TV_FIELDS}&no_404=true`, 8000);
  if(!r.ok) throw new Error('tv '+r.status);
  const j = await r.json();
  if(j.close==null) throw new Error('tv empty');
  return j;
}

/* الجلب الجماعي بقى المستخدم الأساسي — منTV بتفضل للاستخدام الفردي */

/* جلب بمهلة محددة — الوسيط العام ممكن يعلّق دقيقة كاملة */
async function fetchT(url, ms, opts){
  const ctl = new AbortController();
  const to = setTimeout(()=>ctl.abort(), ms);
  try { return await fetch(url, Object.assign({cache:'no-store', signal:ctl.signal}, opts||{})); }
  finally { clearTimeout(to); }
}

/* تحويل رد الوسيط (صيغة ياهو) لمصفوفات الإغلاق/التاريخ/الحجم */
function parseHistory(j){
  const r=j&&j.chart&&j.chart.result&&j.chart.result[0];
  if(!r||!r.timestamp) return null;
  const q=r.indicators.quote[0], c=[],h=[],l=[],v=[],dt=[];
  for(let i=0;i<r.timestamp.length;i++){
    if(q.close[i]==null) continue;
    c.push(q.close[i]); h.push(q.high[i]??q.close[i]); l.push(q.low[i]??q.close[i]);
    v.push(q.volume[i]||0); dt.push(new Date(r.timestamp[i]*1000).toISOString().slice(0,10));
  }
  if(c.length<25) return null;
  return {c,h,l,v,dt,src:(r.meta&&r.meta.dataSource)||'Yahoo'};
}

function analyse(j,tk){
  const r=j&&j.chart&&j.chart.result&&j.chart.result[0];
  if(!r||!r.timestamp) return null;
  const q=r.indicators.quote[0], c=[],h=[],l=[],v=[],dt=[];
  for(let i=0;i<r.timestamp.length;i++){
    if(q.close[i]==null) continue;
    c.push(q.close[i]); h.push(q.high[i]??q.close[i]); l.push(q.low[i]??q.close[i]);
    v.push(q.volume[i]||0); dt.push(new Date(r.timestamp[i]*1000).toISOString().slice(0,10));
  }
  if(c.length<25) return null;
  const n=c.length, px=c[n-1], prev=c[n-2];
  const s20=SMA(c,20), s50=SMA(c,50), s200=SMA(c,200), rsi=RSI(c);
  const w=Math.min(60,n-1);
  const res=Math.max(...h.slice(-w-1,-1)), sup=Math.min(...l.slice(-w-1,-1));
  const vAvg=SMA(v,20);
  let score=0;
  if(s50&&s200) score+= s50>s200?1:-1;
  if(s20) score+= px>s20?1:-1;
  if(rsi!=null) score+= rsi>=55?1: rsi<=45?-1:0;
  if(vAvg&&v[n-1]>vAvg*1.5) score+= px>prev?1:-1;
  return {tk, name:NAMES[tk]||'', px, chg:(px/prev-1)*100, date:dt[n-1],
    closes:c, dates:dt, s20,s50,s200,rsi,res,sup, vol:v[n-1], vAvg,
    src:r.meta.dataSource||'Yahoo', score,
    sig: score>=2?'إيجابي': score<=-2?'سلبي':'محايد'};
}

/* دمج: القيم الفنية من مباشر (أحدث) مع تاريخ الجلسات من الوسيط (للرسم) */
function merge(tk, tv, hist){
  const c=hist.c.slice(), n=c.length;
  const lastDate = tv && tv.date ? tv.date : hist.dt[n-1];
  // لو الجلسة اللحظية أحدث من آخر جلسة في التاريخ، نضيفها كنقطة أخيرة
  if(tv && tv.date && tv.date > hist.dt[n-1]){
    c.push(tv.px); hist.dt.push(tv.date); hist.v.push(tv.vol||0);
  } else if(tv){
    c[n-1]=tv.px; hist.v[n-1]=tv.vol||hist.v[n-1];
  }
  const m=c.length, px=c[m-1];
  const s20 = tv&&tv.s20!=null ? tv.s20 : SMA(c,20);
  const s50 = tv&&tv.s50!=null ? tv.s50 : SMA(c,50);
  const s200= tv&&tv.s200!=null ? tv.s200 : SMA(c,200);
  const rsi = tv&&tv.rsi!=null ? tv.rsi : RSI(c);
  const vAvg = tv&&tv.vAvg!=null ? tv.vAvg : SMA(hist.v,20);
  const w=Math.min(60,m-1);
  const res = Math.max(...hist.h.slice(-w-1,-1));
  const sup = Math.min(...hist.l.slice(-w-1,-1));
  let score=0;
  if(s50&&s200) score+= s50>s200?1:-1;
  if(s20) score+= px>s20?1:-1;
  if(rsi!=null) score+= rsi>=55?1: rsi<=45?-1:0;
  if(vAvg&&hist.v[m-1]>vAvg*1.5) score+= px>c[m-2]?1:-1;
  return {tk, name:NAMES[tk]||'', px, chg:(tv&&tv.chg!=null)?tv.chg:(px/c[m-2]-1)*100,
    date:lastDate, closes:c, dates:hist.dt, s20,s50,s200,rsi,res,sup,
    vol:hist.v[m-1], vAvg, src:(tv&&tv.src)||hist.src, en:tv&&tv.en, score,
    sig: score>=2?'إيجابي': score<=-2?'سلبي':'محايد'};
}

/* بناء عنصر واحد من ردود المصدرين */
function build(tk, tv, hist){
  if(tv && hist) return merge(tk, tv, hist);
  if(tv){
    // مفيش تاريخ: القيم الفنية ونقاط البيفوت موجودة، والرسم غايب
    let score=0;
    if(tv.s50&&tv.s200) score+= tv.s50>tv.s200?1:-1;
    if(tv.s20) score+= tv.px>tv.s20?1:-1;
    if(tv.rsi!=null) score+= tv.rsi>=55?1: tv.rsi<=45?-1:0;
    return {tk, name:NAMES[tk]||'', px:tv.px, chg:tv.chg, date:tv.date||'', en:tv.en,
      closes:[], dates:[], s20:tv.s20, s50:tv.s50, s200:tv.s200, rsi:tv.rsi,
      res:null, sup:null, vol:tv.vol, vAvg:tv.vAvg, src:tv.src, score,
      atr:tv.atr, vola:tv.vola, rec:tv.rec,
      pS1:tv.pS1, pS2:tv.pS2, pS3:tv.pS3, pR1:tv.pR1, pR2:tv.pR2, pR3:tv.pR3, pM:tv.pM,
      hi1m:tv.hi1m, lo1m:tv.lo1m, hi3m:tv.hi3m, lo3m:tv.lo3m,
      hi52:tv.hi52, lo52:tv.lo52,
      sig: score>=2?'إيجابي': score<=-2?'سلبي':'محايد'};
  }
  return analyse(hist&&hist.raw, tk);
}
const NAMES = {
'COMI':'التجاري الدولي','SWDY':'السويدي إليكتريك','ETEL':'المصرية للاتصالات','TMGH':'طلعت مصطفى',
'EGAL':'مصر للألومنيوم','MFPC':'موبكو','QNBE':'بنك قطر الوطني','HDBK':'بنك التعمير والإسكان',
'ABUK':'أبو قير للأسمدة','ALCN':'الإسكندرية لتداول الحاويات','ORAS':'أوراسكوم كونستراكشون','EAST':'الشرقية للدخان',
'EFIH':'إي فاينانس','ADIB':'مصرف أبو ظبي الإسلامي','EMFD':'إعمار مصر','FWRY':'فوري',
'SCTS':'قناة السويس لتوطين التكنولوجيا','CANA':'بنك قناة السويس','ORHD':'أوراسكوم للتنمية مصر','GPPL':'جولدن بيراميدز بلازا',
'VLMR':'فالمور القابضة بالدولار','VLMRA':'فالمور القابضة بالجنيه','EFID':'إيديتا','PHDC':'بالم هيلز',
'JUFO':'جهينة','HRHO':'إي إف جي القابضة - هيرميس','OCDI':'سوديك','GBCO':'جي بي كورب',
'FAIT':'بنك فيصل الإسلامي بالجنيه','FAITA':'بنك فيصل الإسلامي بالدولار','FERC':'فيركيم مصر للأسمدة','BTFH':'بلتون القابضة',
'CIEB':'كريدي أجريكول','HELI':'مصر الجديدة للإسكان','BIOC':'جلاكسو سميثكلاين','EXPA':'البنك المصري لتنمية الصادرات',
'RAYA':'راية القابضة','CCAP':'القلعة للاستثمارات المالية','EGCH':'كيما','IRON':'الحديد والصلب المصرية',

function market(){
  const c = new Date(Date.now()+3*3600000);
  const d = c.getUTCDay(), m = c.getUTCHours()*60+c.getUTCMinutes();
  const O=600, C=855;
  if (d===5||d===6) return {open:false, txt:'إجازة أسبوعية', next:'يفتح الأحد 10:00'};
  if (m<O){ const left=O-m; return {open:false, txt:'لم يفتح بعد', next:`يفتح خلال ${Math.floor(left/60)}س ${left%60}د`}; }
  if (m>C) return {open:false, txt:'أُغلق', next:'يفتح غداً 10:00'};
  const left=C-m; return {open:true, txt:'الجلسة مفتوحة', next:`يتبقى ${Math.floor(left/60)}س ${left%60}د`};
}

/* ---------- المؤشرات ---------- */
const SMA=(a,n)=>a.length<n?null:a.slice(-n).reduce((s,v)=>s+v,0)/n;
function SMAser(a,n){const o=[];for(let i=0;i<a.length;i++)o.push(i<n-1?null:a.slice(i-n+1,i+1).reduce((s,v)=>s+v,0)/n);return o;}
function RSI(c,n=14){
  if(c.length<n+1)return null; let g=0,l=0;
  for(let i=1;i<=n;i++){const d=c[i]-c[i-1]; d>=0?g+=d:l-=d;}
  let ag=g/n,al=l/n;
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];ag=(ag*(n-1)+(d>0?d:0))/n;al=(al*(n-1)+(d<0?-d:0))/n;}
  return al===0?100:100-100/(1+ag/al);
}
function analyse(j,tk){
  const r=j&&j.chart&&j.chart.result&&j.chart.result[0];
  if(!r||!r.timestamp) return null;
  const q=r.indicators.quote[0], c=[],h=[],l=[],v=[],dt=[];
  for(let i=0;i<r.timestamp.length;i++){
    if(q.close[i]==null) continue;
    c.push(q.close[i]); h.push(q.high[i]??q.close[i]); l.push(q.low[i]??q.close[i]);
    v.push(q.volume[i]||0); dt.push(new Date(r.timestamp[i]*1000).toISOString().slice(0,10));
  }
  if(c.length<25) return null;
  const n=c.length, px=c[n-1], prev=c[n-2];
  const s20=SMA(c,20), s50=SMA(c,50), s200=SMA(c,200), rsi=RSI(c);
  const w=Math.min(60,n-1);
  const res=Math.max(...h.slice(-w-1,-1)), sup=Math.min(...l.slice(-w-1,-1));
  const vAvg=SMA(v,20);
  let score=0;
  if(s50&&s200) score+= s50>s200?1:-1;
  if(s20) score+= px>s20?1:-1;
  if(rsi!=null) score+= rsi>=55?1: rsi<=45?-1:0;
  if(vAvg&&v[n-1]>vAvg*1.5) score+= px>prev?1:-1;
  return {tk, name:NAMES[tk]||'', px, chg:(px/prev-1)*100, date:dt[n-1],
    closes:c, dates:dt, s20,s50,s200,rsi,res,sup, vol:v[n-1], vAvg,
    src:r.meta.dataSource||'Yahoo', score,
    sig: score>=2?'إيجابي': score<=-2?'سلبي':'محايد'};
}

/* ---------- رسم ---------- */
function spark(c){
  const d=c.slice(-30); if(d.length<2) return '';
  const mn=Math.min(...d), mx=Math.max(...d), rg=(mx-mn)||1;
  const W=68,H=30,P=3;
  const pts=d.map((v,i)=>[P+i*(W-2*P)/(d.length-1), H-P-((v-mn)/rg)*(H-2*P)]);
  const col=d[d.length-1]>=d[0]?'var(--up)':'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/></svg>`;
}
function chart(a){
  const c=a.closes.slice(-120), dts=a.dates.slice(-120);
  const m20=SMAser(a.closes,20).slice(-120), m50=SMAser(a.closes,50).slice(-120);
  const all=c.concat(m20.filter(x=>x!=null),m50.filter(x=>x!=null));
  const mn=Math.min(...all), mx=Math.max(...all), rg=(mx-mn)||1;
  const W=640,H=230,L=52,R=10,T=14,B=26;
  const x=i=>L+i*(W-L-R)/(c.length-1);
  const y=v=>T+(1-(v-mn)/rg)*(H-T-B);
  const line=(arr,col,wd)=>{
    const p=[]; arr.forEach((v,i)=>{ if(v!=null) p.push((p.length?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)); });
    return p.length?`<path d="${p.join(' ')}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linejoin="round"/>`:'';
  };
  let g='';
  for(let i=0;i<=3;i++){
    const v=mn+rg*i/3, yy=y(v);
    g+=`<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    g+=`<text x="${L-6}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="10" font-family="IBM Plex Mono,monospace" fill="var(--dim)">${fmt(v,1)}</text>`;
  }
  const ticks=[0,Math.floor(c.length/2),c.length-1];
  ticks.forEach(i=>{ g+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" font-family="IBM Plex Mono,monospace" fill="var(--dim)">${dts[i].slice(5)}</text>`; });
  const last=c[c.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="سعر الإغلاق آخر 120 جلسة">
    ${g}${line(m50,'var(--dim)',1.2)}${line(m20,'var(--accent)',1.4)}${line(c,'var(--fg)',1.8)}
    <circle cx="${x(c.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3.2" fill="var(--fg)"/>
  </svg>`;
}

  return `<div class="sh-top">
      <div><div class="tk" style="font-size:14px">${a.tk}.CA</div><div style="font-weight:600">${a.name||NAMES[a.tk]||''}</div></div>

    <div class="chips">

      ${an.trend?`<span class="chip">اتجاه ${an.trend}</span>`:''}
      ${a.rec!=null?`<span class="chip">تقييم فني ${a.rec>0?'+':''}${a.rec.toFixed(2)}</span>`:''}
      ${a.vola!=null?`<span class="chip">تقلب ${a.vola.toFixed(1)}%</span>`:''}
    </div>
    ${planBlock}
    ${lvBlock}
    ${a.closes.length ? chart(a) + '<div class="lg"><span><i style="background:var(--fg)"></i>السعر</span><span><i style="background:var(--accent)"></i>متوسط 20</span><span><i style="background:var(--dim)"></i>متوسط 50</span></div>'
      : ''}
    ${pivotBlock}
    <div class="grid">
      <div class="cell"><span>RSI (14)</span><b>${a.rsi==null?'—':a.rsi.toFixed(1)}</b></div>

      <div class="cell"><span>أدنى ٥٢ أسبوعاً</span><b>${fmn(a.lo52)}</b></div>

      لأغراض المعلومات وليست نصيحة استثمارية.</p>
    <div style="display:flex;gap:8px;margin-top:14px"><button id="close" type="button">إغلاق</button></div>`;
}

/* ---------- تحميل ----------
   مباشر (TradingView): طلب واحد بيرجّع السوق كله — ٢٢٩ سهم مرة واحدة.
   بنستخدم content-type: text/plain عشان الطلب يفضل «بسيط» من غير
   preflight، ودي الطريقة الوحيدة اللي بتشتغل من المتصفح.            */
const TV_SCAN = 'https://scanner.tradingview.com/egypt/scan';
const TV_COLS = ['close','change','RSI','SMA20','SMA50','SMA200','volume','average_volume_10d_calc',
                 'price_52_week_high','price_52_week_low','description','type',
                 'ATR','Volatility.D','Recommend.All',
                 'Pivot.M.Classic.S1','Pivot.M.Classic.S2','Pivot.M.Classic.S3',
                 'Pivot.M.Classic.R1','Pivot.M.Classic.R2','Pivot.M.Classic.R3',
                 'Pivot.M.Classic.Middle','High.1M','Low.1M','High.3M','Low.3M'];

async function fetchMarket(){
  const body = JSON.stringify({
    symbols: { tickers: SYMS.map(t=>'EGX:'+t), query: { types: [] } },
    columns: TV_COLS,
  });
  const r = await fetchT(TV_SCAN, 20000, {method:'POST', headers:{'Content-Type':'text/plain'}, body});
  if(!r.ok) throw new Error('scan '+r.status);
  const j = await r.json();
  if(!j || !j.data) throw new Error('scan empty');
  return j.data;
}

function tvItem(tk, d){
  const v = {};
  TV_COLS.forEach((c,i)=>{ v[c]=d[i]; });
  return {tk, px:v.close, chg:v.change,
    date:new Date(Date.now()+3*3600000).toISOString().slice(0,10),
    s20:v.SMA20, s50:v.SMA50, s200:v.SMA200, rsi:v.RSI,
    vol:v.volume, vAvg:v.average_volume_10d_calc,
    hi52:v.price_52_week_high, lo52:v.price_52_week_low,
    atr:v.ATR, vola:v['Volatility.D'], rec:v['Recommend.All'],
    pS1:v['Pivot.M.Classic.S1'], pS2:v['Pivot.M.Classic.S2'], pS3:v['Pivot.M.Classic.S3'],
    pR1:v['Pivot.M.Classic.R1'], pR2:v['Pivot.M.Classic.R2'], pR3:v['Pivot.M.Classic.R3'],
    pM:v['Pivot.M.Classic.Middle'],
    hi1m:v['High.1M'], lo1m:v['Low.1M'], hi3m:v['High.3M'], lo3m:v['Low.3M'],
    en:v.description, src:'مباشر (TradingView)'};
}

/* ---------- محلل الفرص: نقاط الدخول والخروج والأهداف ----------
   كل الأرقام محسوبة من بيانات السوق: نقاط البيفوت الكلاسيكية، ATR
   للتقلب، والمتوسطات. مفيش أي رقم مكتوب بالإيد.                 */

/* دقة العرض بتتدرج حسب سعر السهم — أسهم بقرش وأسهم بألف جنيه */
function dp(v){
  const x=Math.abs(v||0);
  return x>=10 ? 2 : x>=1 ? 3 : x>=0.1 ? 4 : 5;
}
const fmn = v => fmt(v, dp(v));
const r2 = n => n==null||!isFinite(n) ? null : Math.round(n*100)/100;

/* اتجاه السهم من ترتيب المتوسطات والسعر */
function trendOf(a){
  const {px,s20,s50,s200}=a;
  if(s20==null||s50==null) return {t:'غير محدد', w:0};
  let w=0;
  if(s200!=null) w += s50>s200 ? 1 : -1;
  w += px>s20 ? 1 : -1;
  w += px>s50 ? 1 : -1;
  if(w>=2) return {t:'صاعد', w};
  if(w<=-2) return {t:'هابط', w};
  return {t:'عرضي', w};
}

/* أقرب مستوى تحت السعر وفوقه — الأساس لنقاط الدخول والخروج */
function levels(a){
  const above=[], below=[];
  const eps = Math.max(a.px*0.002, 1e-9);   // مستوى ملزوق في السعر مش مستوى
  const put=(v,label)=>{ if(v==null||!isFinite(v)||v<=0) return;
    if(Math.abs(v-a.px) < eps) return;
    (v>a.px?above:below).push({v,label}); };
  put(a.pR1,'مقاومة ١ بيفوت');
  put(a.pR2,'مقاومة ٢ بيفوت');
  put(a.pR3,'مقاومة ٣ بيفوت');
  put(a.pM,'نقطة البيفوت');
  put(a.pS1,'دعم ١ بيفوت');
  put(a.pS2,'دعم ٢ بيفوت');
  put(a.pS3,'دعم ٣ بيفوت');
  put(a.s20,'متوسط ٢٠');
  put(a.s50,'متوسط ٥٠');
  put(a.s200,'متوسط ٢٠٠');
  put(a.hi1m,'أعلى شهر');
  put(a.lo1m,'أدنى شهر');
  put(a.hi3m,'أعلى ٣ شهور');
  put(a.lo3m,'أدنى ٣ شهور');
  put(a.hi52,'أعلى ٥٢ أسبوعاً');
  put(a.lo52,'أدنى ٥٢ أسبوعاً');
  above.sort((x,y)=>x.v-y.v);
  below.sort((x,y)=>y.v-x.v);
  // الدور بيتحدد بالموضع مش بالاسم: اللي فوق السعر مقاومة واللي تحته دعم
  above.forEach(o=>o.role='مقاومة');
  below.forEach(o=>o.role='دعم');
  return {sup: below[0]||null, res: above[0]||null,
          sup2: below[1]||null, res2: above[1]||null, above};
}

/* تصنيف الفرصة + نقاط الدخول والخروج والأهداف */
function analyse(a){
  const L = levels(a);
  const {t:trend} = trendOf(a);
  const atr = a.atr;
  const rec = a.rec;
  const px = a.px;

  // سهم ساكن: مفيش تقلب ومفيش مستويات — مفيش خطة تتحسب أصلاً
  const flat = (atr==null || atr < px*0.0005) && !L.sup && !L.res;
  if(flat){
    return {kind:'ساكن — بلا حركة', trend:'غير محدد', entry:null, entryZone:null,
      stop:null, t1:null, t2:null, rr:null, risk:null,
      sup:null, res:null, sup2:null, res2:null, atr,
      why:['السهم مش بيتحرك ومفيش مستويات كافية لحساب خطة دخول وخروج.',
           'الأوراق الساكنة صعب البيع فيها بالسعر اللي تشتري بيه.']};
  }

  // وحدة الوقف: ٢×ATR لو متاح، وإلا ٥٪ من السعر
  const atrUnit = atr!=null ? atr*2 : px*0.05;

  // الدخول عند السعر الحالي، ومنطقة الدخول المفضلة عند أقرب دعم
  const entry = px;
  const entryZone = L.sup && L.sup.v < px
    ? [L.sup.v*1.002, px]
    : [px*0.995, px*1.005];

  // الوقف: تحت الدعم مباشرة، مع حد أدنى ٠.٨×ATR (عشان الضوضاء ما تضربهوش)
  // وحد أقصى ١٥٪ من السعر (عشان المخاطرة تفضل معقولة)
  let stopRaw = L.sup ? L.sup.v*0.985 : px - atr*2;
  const minRisk = atr!=null ? atr*0.8 : px*0.02;
  const maxRisk = px*0.15;
  if(entry - stopRaw < minRisk) stopRaw = entry - minRisk;
  if(entry - stopRaw > maxRisk) stopRaw = entry - maxRisk;
  const stop = stopRaw;

  // الأهداف: أول مقاومة فوق السعر بمسافة معقولة (≥٠.٥×ATR)، وإلا مضاعفات ATR
  const minStep = atr!=null ? atr*0.5 : px*0.02;
  const far = L.above.filter(o => o.v > entry + minStep);
  const t1 = far[0] ? far[0].v : entry + atrUnit*1.5;
  const t2 = far[1] ? far[1].v : (far[0] ? far[0].v + atrUnit*1.2 : entry + atrUnit*2.5);
  const t1src = far[0] ? far[0].label : null;
  const t2src = far[1] ? far[1].label : null;

  const risk = entry - stop;
  const rr = risk>0 && t1>entry ? (t1-entry)/risk : null;

  // التصنيف
  let score = 0;
  if(trend==='صاعد') score += 2; else if(trend==='هابط') score -= 2;
  if(a.rsi!=null){ if(a.rsi<=35) score+=1; else if(a.rsi>=70) score-=1; }
  if(rec!=null){ if(rec>=0.3) score+=2; else if(rec<=-0.3) score-=2; }
  if(a.vAvg && a.vol) score += a.vol>a.vAvg*1.3 ? 1 : 0;
  if(L.sup && (px-L.sup.v)/px < 0.02) score += 1;      // قريب من دعم
  if(rr!=null && rr>=2) score += 1;                     // عائد يستحق المخاطرة
  if(rr!=null && rr<1) score -= 1;                      // عائد ضعيف مقابل المخاطرة

  let kind, why=[];
  if(score>=4) kind='فرصة قوية';
  else if(score>=2) kind='فرصة';
  else if(score<=-3) kind='خطر — اتجاه هابط';
  else if(a.rsi!=null && a.rsi>=70) kind='تشبع شرائي';
  else kind='مراقبة';

  // بوابة جودة: ما ينفعش نسميها «فرصة قوية» وعائدها أقل من ١.٥ مقابل المخاطرة
  if(kind==='فرصة قوية' && (rr==null || rr<1.5)) kind='فرصة';

  if(trend==='صاعد') why.push('الاتجاه العام صاعد (المتوسطات مرتبة تصاعدياً).');
  else if(trend==='هابط') why.push('الاتجاه العام هابط — الدخول مخاطرة.');
  else why.push('الاتجاه عرضي — مفيش اتجاه واضح.');
  if(a.rsi!=null){
    if(a.rsi<=35) why.push(`RSI ${a.rsi.toFixed(0)} — قريب من التشبع البيعي، احتمال ارتداد.`);
    else if(a.rsi>=70) why.push(`RSI ${a.rsi.toFixed(0)} — تشبع شرائي، احتمال تصحيح.`);
    else why.push(`RSI ${a.rsi.toFixed(0)} — زخم متوسط.`);
  }
  if(rec!=null) why.push(`التقييم الفني المجمّع ${rec>0?'+':''}${rec.toFixed(2)} (من −١ إلى +١).`);
  if(a.atr!=null) why.push(`متوسط التحرك اليومي (ATR) ${a.atr.toFixed(2)} جنيه — الوقف على بعد ${(risk/px*100).toFixed(1)}% من السعر.`);
  if(L.sup) why.push(`المستوى المعتمد تحت السعر: ${L.sup.label} عند ${fmn(L.sup.v)}.`);
  if(t1src) why.push(`الهدف الأول عند ${t1src} ${fmn(t1)}.`);
  else why.push(`الهدف الأول ${fmn(t1)} (مضاعف ATR — مفيش مقاومة قريبة).`);
  if(t2src) why.push(`الهدف الثاني عند ${t2src} ${fmn(t2)}.`);
  if(rr!=null) why.push(rr>=2
    ? `نسبة العائد للمخاطرة ${rr.toFixed(1)}:١ — عائد يستحق المخاطرة.`
    : rr>=1 ? `نسبة العائد للمخاطرة ${rr.toFixed(1)}:١ — مقبولة.`
            : `نسبة العائد للمخاطرة ${rr.toFixed(1)}:١ — ضعيفة، الأفضل الانتظار.`);

  return {kind, why, trend, entry, entryZone, stop, t1, t2, rr, risk,
          sup:L.sup, res:L.res, sup2:L.sup2, res2:L.res2, atr};
}

/* مصدر التاريخ: الوسيط على كلاودفلير — ممكن يتحجب لغياب CORS.
   بنجرب مرة واحدة بس ونحفظ النتيجة، عشان ما نستناش مهلة لكل سهم. */
let HIST_MODE = null;   // 'direct' | 'mirror' | 'off'

async function probeHistory(){
  try{
    const r = await fetchT(`${WORKER}/COMI.CA?range=1y&interval=1d&t=${Date.now()}`, 6000);
    if(r.ok){ await r.json(); HIST_MODE='direct'; return; }
  }catch(e){}
  try{
    const r = await fetchT(buildURL('COMI'), 6000);
    if(r.ok){ await r.json(); HIST_MODE='mirror'; return; }
  }catch(e){}
  HIST_MODE='off';
}

async function history(tk){
  if(HIST_MODE===null) await probeHistory();
  if(HIST_MODE==='off') return null;
  try{
    const url = HIST_MODE==='direct'
      ? `${WORKER}/${tk}.CA?range=1y&interval=1d&t=${Date.now()}`
      : buildURL(tk);
    const r = await fetchT(url, 12000);
    if(!r.ok) return null;
    const j = await r.json();
    const h = parseHistory(j);
    return h ? {raw:j, ...h} : null;
  }catch(e){ return null; }
}

/* تفاصيل سهم واحد عند الطلب — مش بنجيب تاريخ ٢٢٩ سهم مقدماً */
async function loadHistory(tk){
  const h = await history(tk);
  if(!h) return;
  const i = DATA.findIndex(d=>d.tk===tk);
  if(i<0) return;
  const base = DATA[i];
  const merged = build(tk, base, h);
  merged.en = base.en;
  merged.atr = base.atr; merged.vola = base.vola; merged.rec = base.rec;
  merged.pS1=base.pS1; merged.pS2=base.pS2; merged.pS3=base.pS3;
  merged.pR1=base.pR1; merged.pR2=base.pR2; merged.pR3=base.pR3; merged.pM=base.pM;
  merged.hi1m=base.hi1m; merged.lo1m=base.lo1m; merged.hi3m=base.hi3m; merged.lo3m=base.lo3m;
  merged.an = analyse(merged);
  DATA[i] = merged;
  if($('dlg').open) $('sheet').innerHTML = sheetHTML(merged);
  render();
}

async function load(){
  paintStatus();
  $('list').innerHTML = '<div class="skel"></div>'.repeat(8);
  $('foot').textContent='';
  try{
    const rows = await fetchMarket();
    const bySym = {};
    rows.forEach(d=>{ bySym[d.s.replace('EGX:','')] = d; });
    DATA = SYMS.filter(t=>bySym[t]).map(t=>{
      const a = build(t, tvItem(t, bySym[t].d), null);
      a.an = analyse(a);
      return a;
    });
    // الرموز اللي المنصة مش بتغطيها — تفضل في القائمة بعلامة «—»
    const missing = SYMS.filter(t=>!bySym[t]);
    missing.forEach(t=>DATA.push({tk:t, name:'', px:null, chg:null, date:'',
      closes:[], dates:[], s20:null,s50:null,s200:null,rsi:null,res:null,sup:null,
      vol:null, vAvg:null, src:'—', score:0, sig:'محايد', noData:true}));
  }catch(e){
    DATA=[];
  }
  render();
  stampLine(true);
  if (typeof checkAlerts === 'function') checkAlerts(DATA.filter(d=>!d.noData));
  const srcs=[...new Set(DATA.filter(d=>!d.noData).map(d=>d.src))];
  const live=DATA.filter(d=>!d.noData).length;
  if(live===0){
    $('foot').textContent = 'تعذر تحميل البيانات — راجع الاتصال بالإنترنت ثم اضغط تحديث.';
  } else if(srcs.some(s=>s.includes('TradingView'))){
    $('foot').textContent = 'الأسعار والمؤشرات لحظية مع تأخير بسيط. اضغط على أي سهم للتفاصيل.'
      + ' تحليل آلي وليس نصيحة استثمارية.';
  } else {
    $('foot').textContent = 'تعذر جلب السعر اللحظي — البيانات المعروضة هي آخر إغلاق متاح. تحليل آلي وليس نصيحة استثمارية.';
  }
}

/* سطر الحالة — بيتحدّث بعد كل دفعة، وبيحذّر لو البيانات قديمة */
function stampLine(done){
  const t=new Date(Date.now()+3*3600000).toISOString().slice(11,16);
  const live=DATA.filter(d=>!d.noData);
  const ages=live.map(d=>Math.round((Date.now()-Date.parse(d.date))/86400000)).filter(n=>isFinite(n));
  const fresh=ages.length?Math.min(...ages):null;
  const stale=fresh!=null&&fresh>3;
  const miss=DATA.length-live.length;
  $('stamp').textContent = `آخر تحديث ${t} بتوقيت القاهرة · ${live.length} من ${DATA.length} سهم`
    + (miss?` (${miss} بلا بيانات)`:'')
    + (stale?` · آخر جلسة قبل ${fresh} يوم`:'');
  if(stale && done){
    $('foot').textContent = `تحذير: أحدث جلسة متاحة قبل ${fresh} يوم — قد تكون البيانات متأخرة. تحليل آلي وليس نصيحة استثمارية.`;
  }
}

/* ---------- بحث وترتيب وفلترة ---------- */
let QUERY='', SORT='default', FILTER=null;

/* تطبيع النص العربي: الألف والتاء المربوطة والياء والهمزات والتشكيل */
function norm(s){
  return (s||'')
    .replace(/[\u064B-\u0652\u0640]/g,'')      // تشكيل وتطويل
    .replace(/[أإآٱ]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/ؤ/g,'و')
    .replace(/ئ/g,'ي')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}

function matchFilter(d){
  if(!FILTER) return true;
  if(d.noData) return false;
  const an=d.an||{};
  switch(FILTER){
    case 'opp':      return an.kind==='فرصة' || an.kind==='فرصة قوية';
    case 'strong':   return an.kind==='فرصة قوية';
    case 'up':       return an.trend==='صاعد';
    case 'down':     return an.trend==='هابط';
    case 'oversold': return d.rsi!=null && d.rsi<=35;
    case 'nearlow':  return d.lo52!=null && (d.px-d.lo52)/d.px <= 0.05;
  }
  return true;
}

function visible(){
  const q=norm(QUERY.trim());
  let arr=DATA.filter(matchFilter);
  if(q) arr=arr.filter(d=>
    d.tk.toLowerCase().includes(q) ||
    norm(NAMES[d.tk]).includes(q) ||
    norm(d.en).includes(q));
  if(SORT==='gain') arr.sort((a,b)=>(b.chg??-999)-(a.chg??-999));
  else if(SORT==='lose') arr.sort((a,b)=>(a.chg??999)-(b.chg??999));
  else if(SORT==='vol') arr.sort((a,b)=>(b.vol??-1)-(a.vol??-1));
  else if(SORT==='rr') arr.sort((a,b)=>((b.an&&b.an.rr)??-1)-((a.an&&a.an.rr)??-1));
  else if(SORT==='name') arr.sort((a,b)=>norm(NAMES[a.tk]||a.tk).localeCompare(norm(NAMES[b.tk]||b.tk),'ar'));
  return arr;
}
function render(){
  const arr=visible();
  const MAX=120;
  const shown=arr.slice(0,MAX);
  $('list').innerHTML = shown.map(rowHTML).join('')
    + (arr.length>MAX ? `<p class="note">بيظهر أول ${MAX} سهم من ${arr.length} — استخدم البحث للوصول لباقي السوق.</p>` : '')
    + (arr.length===0 ? '<p class="note">مفيش نتائج مطابقة.</p>' : '');
}

$('q').addEventListener('input', e=>{ QUERY=e.target.value; render(); });
$('sort').addEventListener('change', e=>{ SORT=e.target.value; render(); });
$('filters').addEventListener('click', e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  const f=c.dataset.f;
  FILTER = (FILTER===f) ? null : f;
  [...$('filters').children].forEach(x=>x.classList.toggle('on', x.dataset.f===FILTER));
  render();
});

$('list').addEventListener('click',e=>{
  const b=e.target.closest('.row'); if(!b || b.disabled) return;
  const a=DATA.find(d=>d.tk===b.dataset.tk); if(!a) return;
  $('sheet').innerHTML=sheetHTML(a); $('dlg').showModal();
  // نجيب تاريخ الجلسات عند الطلب بس (للرسم والدعم والمقاومة)
  if(!a.closes.length) loadHistory(a.tk);
});
$('dlg').addEventListener('click',e=>{ if(e.target.id==='close'||e.target===$('dlg')) $('dlg').close(); });
$('reload').addEventListener('click',load);
setInterval(paintStatus,30000);
setInterval(()=>{ if(market().open) load(); },5*60*1000);
load();
</script>
<div class="wrap" style="padding-block:0 0">
  <div class="btnrow">
    <button id="install" type="button">تثبيت على الشاشة الرئيسية</button>
    <button id="notify" type="button">تفعيل التنبيهات</button>
  </div>
  <div class="banner" id="banner" hidden></div>
</div>

<script>
/* ---------- تثبيت التطبيق ---------- */
let deferred = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e;
  document.getElementById('install').classList.add('on');
});
document.getElementById('install').addEventListener('click', async () => {
  if (!deferred) return;
  deferred.prompt(); await deferred.userChoice; deferred = null;
  document.getElementById('install').classList.remove('on');
});
if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
  document.getElementById('install').classList.remove('on');
}

/* ---------- تنبيهات داخل التطبيق (وهو مفتوح) ---------- */
const nbtn = document.getElementById('notify');
if ('Notification' in window) {
  nbtn.classList.add('on');
  const paint = () => {
    if (Notification.permission === 'granted') { nbtn.textContent = 'التنبيهات مفعّلة'; nbtn.classList.add('active'); }
    else if (Notification.permission === 'denied') { nbtn.textContent = 'التنبيهات محظورة'; }
    else nbtn.textContent = 'تفعيل التنبيهات';
  };
  paint();
  nbtn.addEventListener('click', async () => { try { await Notification.requestPermission(); } catch(e){} paint(); });
}
let SEEN = {};
try { SEEN = JSON.parse(localStorage.getItem('egx.seen') || '{}'); } catch(e){}
function checkAlerts(list) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const hits = [];
  for (const a of list) {
    const flags = [];
    if (a.rsi != null && a.rsi <= 30) flags.push('تشبع بيعي RSI ' + a.rsi.toFixed(0));
    if (a.rsi != null && a.rsi >= 70) flags.push('تشبع شرائي RSI ' + a.rsi.toFixed(0));
    if (a.res != null && a.px > a.res) flags.push('اخترق المقاومة ' + a.res.toFixed(2));
    if (a.sup != null && a.px < a.sup) flags.push('كسر الدعم ' + a.sup.toFixed(2));
    if (a.hi52 != null && a.px >= a.hi52) flags.push('أعلى سعر في 52 أسبوعاً');
    if (a.lo52 != null && a.px <= a.lo52) flags.push('أدنى سعر في 52 أسبوعاً');
    if (Math.abs(a.chg) >= 4) flags.push((a.chg >= 0 ? '+' : '') + a.chg.toFixed(1) + '% في الجلسة');
    for (const f of flags) {
      const key = a.tk + '|' + f.slice(0, 14) + '|' + a.date;
      if (SEEN[key]) continue;
      SEEN[key] = Date.now();
      hits.push({ tk: a.tk, name: a.name, f });
    }
  }
  const cut = Date.now() - 3 * 86400000;
  for (const k in SEEN) if (SEEN[k] < cut) delete SEEN[k];
  try { localStorage.setItem('egx.seen', JSON.stringify(SEEN)); } catch(e){}
  hits.slice(0, 4).forEach(h => {
    try { new Notification(h.tk + ' · ' + h.name, { body: h.f, icon: 'icons/icon-192.png', tag: h.tk }); } catch(e){}
  });
}

/* ---------- تسجيل خدمة العمل ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- لافتة التوضيح ---------- */
(function () {
  const b = document.getElementById('banner');
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (!standalone && ios) {
    b.hidden = false;
    b.innerHTML = 'لتثبيت التطبيق على الآيفون: من شريط سفاري اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».';
  }
})();
</script>
