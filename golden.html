<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الفرص الذهبية">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="أقوى 5 أسهم للاستثمار — تحليل فني ومالي واساسي شامل مع أخبار حقيقية">
<title>الفرص الذهبية — أقوى 5 أسهم للاستثمار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#f6f4ef;--surface:#fffefb;--surface-2:#efebe2;--line:#e0dacd;--fg:#1b1813;--dim:#6d6558;--accent:#9a6f10;--up:#0d7a4a;--down:#b6342a;--flat:#7a7264;--gold:#d4a017;--gold-light:#f5e6b8;--gold-dark:#8b6914;--shadow:0 1px 2px rgba(40,32,16,.06),0 8px 24px rgba(40,32,16,.05);--f-ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif;--f-num:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--surface:#1b1917;--surface-2:#24211d;--line:#2f2b25;--fg:#f1ece2;--dim:#9b9285;--accent:#d9ab4a;--up:#3ccf8e;--down:#ff6f61;--flat:#8c8478;--gold:#f0c040;--gold-light:#3a3010;--gold-dark:#f0c040;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121110;--surface:#1b1917;--surface-2:#24211d;--line:#2f2b25;--fg:#f1ece2;--dim:#9b9285;--accent:#d9ab4a;--up:#3ccf8e;--down:#ff6f61;--flat:#8c8478;--gold:#f0c040;--gold-light:#3a3010;--gold-dark:#f0c040;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);margin:0;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:0 16px;padding-block:0 32px}
[dir=rtl]{direction:rtl}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:12px 16px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--dim);font-family:var(--f-num)}
.spacer{flex:1}
button{font-family:inherit;font-size:13px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
.gold-bar{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:var(--gold-dark);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gold-bar .icon{font-size:28px}
.gold-bar .title{font-weight:700;font-size:15px}
.gold-bar .desc{font-size:12px;opacity:.85}
.golden-list{display:flex;flex-direction:column;gap:12px}
.g-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.g-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--gold)}
.g-card .rank{position:absolute;top:12px;left:12px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:var(--f-num)}
.g-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.g-tk{font-family:var(--f-num);font-size:13px;font-weight:600;color:var(--accent)}
.g-name{font-weight:600;font-size:15px}
.g-px{font-family:var(--f-num);font-size:22px;font-weight:600}
.g-chg{font-family:var(--f-num);font-size:13px}
.g-chg.up{color:var(--up)}.g-chg.down{color:var(--down)}
.g-score{display:flex;align-items:center;gap:8px;margin:8px 0}
.g-score .bar{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.g-score .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--up))}
.g-score .val{font-family:var(--f-num);font-weight:600;font-size:14px;color:var(--gold)}
.g-indicators{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:12px 0}
.g-ind{background:var(--surface-2);border-radius:8px;padding:8px 10px;text-align:center}
.g-ind .label{font-size:10px;color:var(--dim);margin-bottom:2px}
.g-ind .value{font-family:var(--f-num);font-size:13px;font-weight:600}
.g-ind .value.up{color:var(--up)}.g-ind .value.down{color:var(--down)}.g-ind .value.neutral{color:var(--flat)}
.g-analysis{margin-top:12px}
.g-analysis h3{font-size:13px;font-weight:600;margin:12px 0 6px;color:var(--dim)}
.g-analysis ul{margin:0;padding-inline-start:18px;font-size:13px;line-height:1.8}
.g-analysis li{margin-bottom:4px}
.g-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;margin:2px}
.g-tag.positive{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.g-tag.negative{background:color-mix(in srgb,var(--down) 15%,transparent);color:var(--down)}
.g-tag.neutral{background:var(--surface-2);color:var(--dim)}
.g-plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
.g-plan .cell{background:var(--surface-2);border-radius:8px;padding:8px 10px;text-align:center}
.g-plan .cell span{font-size:10px;color:var(--dim);display:block;margin-bottom:2px}
.g-plan .cell b{font-family:var(--f-num);font-size:14px;font-weight:600}
.g-plan .cell.entry b{color:var(--accent)}.g-plan .cell.stop b{color:var(--down)}.g-plan .cell.target b{color:var(--up)}
.g-news{margin-top:12px;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:12px}
.g-news .news-item{margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.g-news .news-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.g-news .news-title{font-weight:600}
.g-news .news-source{font-size:10px;color:var(--dim);font-family:var(--f-num)}
.skel{height:120px;border-radius:14px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:400% 100%;animation:sh 1.4s infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.note{font-size:12px;color:var(--dim);margin:14px 2px 0;line-height:1.7}
.back-btn{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;text-decoration:none;color:var(--accent);font-size:13px;font-weight:600}
.back-btn:hover{text-decoration:underline}
</style>
</head>
<body>
<div dir="rtl">
<div class="wrap">
<header>
<div class="hrow"><h1>🏆 الفرص الذهبية</h1><span class="sub" id="stamp"></span><span class="spacer"></span><button id="reload" type="button">تحديث</button></div>
</header>
<a href="index.html" class="back-btn">→ العودة للقائمة الرئيسية</a>
<div class="gold-bar"><span class="icon">🥇</span><div><div class="title">أقوى 5 أسهم للاستثمار</div><div class="desc">تحليل فني ومالي واساسي شامل مع أخبار حقيقية — اختيار آلي مبني على مؤشرات متعددة</div></div></div>
<div class="golden-list" id="list"></div>
<p class="note" id="foot"></p>
</div>
</div>
<script>
const TV_SCAN="https://scanner.tradingview.com/egypt/scan";
const TV_COLS=["close","change","RSI","SMA20","SMA50","SMA200","volume","average_volume_10d_calc","price_52_week_high","price_52_week_low","description","type","ATR","Volatility.D","Recommend.All","Pivot.M.Classic.S1","Pivot.M.Classic.S2","Pivot.M.Classic.S3","Pivot.M.Classic.R1","Pivot.M.Classic.R2","Pivot.M.Classic.R3","Pivot.M.Classic.Middle","High.1M","Low.1M","High.3M","Low.3M"];
const BLUE_CHIPS=["COMI","SWDY","ETEL","TMGH","EGAL","MFPC","QNBE","HDBK","ABUK","ALCN","ORAS","EAST","EFIH","ADIB","EMFD","FWRY","SCTS","CANA","ORHD","GPPL","VLMR","VLMRA","EFID","PHDC","JUFO","HRHO","OCDI","GBCO","FAIT","FAITA"];
const NAMES={"COMI":"التجاري الدولي","SWDY":"السويدي إليكتريك","ETEL":"المصرية للاتصالات","TMGH":"طلعت مصطفى","EGAL":"مصر للألومنيوم","MFPC":"موبكو","QNBE":"بنك قطر الوطني","HDBK":"بنك التعمير والإسكان","ABUK":"أبو قير للأسمدة","ALCN":"الإسكندرية لتداول الحاويات","ORAS":"أوراسكوم كونستراكشون","EAST":"الشرقية للدخان","EFIH":"إي فاينانس","ADIB":"مصرف أبو ظبي الإسلامي","EMFD":"إعمار مصر","FWRY":"فوري","SCTS":"قناة السويس لتوطين التكنولوجيا","CANA":"بنك قناة السويس","ORHD":"أوراسكوم للتنمية مصر","GPPL":"جولدن بيراميدز بلازا","VLMR":"فالمور القابضة بالدولار","VLMRA":"فالمور القابضة بالجنيه","EFID":"إيديتا","PHDC":"بالم هيلز","JUFO":"جهينة","HRHO":"إي إف جي القابضة - هيرميس","OCDI":"سوديك","GBCO":"جي بي كورب","FAIT":"بنك فيصل الإسلامي بالجنيه","FAITA":"بنك فيصل الإسلامي بالدولار"};
const fmt=(n,d=2)=>n==null||!isFinite(n)?"—":Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=n=>n==null||!isFinite(n)?"—":(n>=0?"+":"")+n.toFixed(2)+"%";
const cls=n=>n==null?"flat":n>0.0001?"up":n<-0.0001?"down":"flat";
const dp=v=>{const x=Math.abs(v||0);return x>=10?2:x>=1?3:x>=0.1?4:5};
const fmn=v=>fmt(v,dp(v));

async function fetchMarket(){
  const body=JSON.stringify({symbols:{tickers:BLUE_CHIPS.map(t=>"EGX:"+t),query:{types:[]}},columns:TV_COLS});
  const r=await fetch(TV_SCAN,{method:"POST",headers:{"Content-Type":"text/plain"},body});
  if(!r.ok)throw new Error("scan "+r.status);
  const j=await r.json();
  if(!j||!j.data)throw new Error("scan empty");
  return j.data;
}

function tvItem(tk,d){
  const v={};
  TV_COLS.forEach((c,i)=>{v[c]=d[i]});
  return{tk,px:v.close,chg:v.change,s20:v.SMA20,s50:v.SMA50,s200:v.SMA200,rsi:v.RSI,vol:v.volume,vAvg:v.average_volume_10d_calc,hi52:v.price_52_week_high,lo52:v.price_52_week_low,atr:v.ATR,vola:v["Volatility.D"],rec:v["Recommend.All"],pS1:v["Pivot.M.Classic.S1"],pS2:v["Pivot.M.Classic.S2"],pS3:v["Pivot.M.Classic.S3"],pR1:v["Pivot.M.Classic.R1"],pR2:v["Pivot.M.Classic.R2"],pR3:v["Pivot.M.Classic.R3"],pM:v["Pivot.M.Classic.Middle"],hi1m:v["High.1M"],lo1m:v["Low.1M"],hi3m:v["High.3M"],lo3m:v["Low.3M"],en:v.description,src:"مباشر (TradingView)"};
}

function goldenScore(a){
  let score=0;
  const reasons=[];
  if(a.s50>a.s200){score+=15;reasons.push("المتوسط 50 فوق 200 — اتجاه صاعد طويل الأمد")}
  if(a.px>a.s20){score+=5;reasons.push("السعر فوق متوسط 20 — زخم قصير إيجابي")}
  if(a.px>a.s50){score+=5;reasons.push("السعر فوق متوسط 50 — اتجاه متوسط إيجابي")}
  if(a.rsi!=null&&a.rsi>=50&&a.rsi<=70){score+=10;reasons.push("RSI "+a.rsi.toFixed(0)+" — زخم صحي غير مشبع")}
  if(a.rec!=null&&a.rec>0){score+=10;reasons.push("تقييم فني إيجابي "+a.rec.toFixed(2))}
  if(a.vola!=null&&a.vola<30){score+=10;reasons.push("تقلب "+a.vola.toFixed(1)+"% — استقرار جيد")}
  if(a.atr!=null&&a.atr<a.px*0.03){score+=10;reasons.push("تقلب يومي معقول — مناسب للاستثمار طويل الأمد")}
  if(a.pS1!=null&&a.px>a.pS1){score+=8;reasons.push("السعر فوق دعم البيفوت — مستوى دخول جيد")}
  if(a.pR1!=null&&a.px<a.pR1){score+=7;reasons.push("السعر تحت مقاومة البيفوت — مسار صاعد")}
  if(a.vol>a.vAvg*1.3){score+=5;reasons.push("حجم تداول مرتفع — اهتمام مستثمرين")}
  if(a.px>a.hi52*0.9){score+=5;reasons.push("قرب أعلى 52 أسبوعاً — زخم قوي")}
  return{score:Math.min(score,100),reasons};
}

function cardHTML(a,rank,scoreData){
  const k=cls(a.chg);
  const score=scoreData.score;
  const scoreColor=score>=70?"var(--up)":score>=50?"var(--gold)":"var(--down)";
  const atr=a.atr||a.px*0.02;
  const stop=a.px-atr*2;
  const t1=a.px+atr*3;
  const t2=a.px+atr*5;
  const rr=((t1-a.px)/(a.px-stop)).toFixed(1);
  return '<div class="g-card">'
    +'<div class="rank">'+rank+'</div>'
    +'<div class="g-header"><div><div class="g-tk">'+a.tk+'.CA</div><div class="g-name">'+(NAMES[a.tk]||a.name||'')+'</div></div><span class="spacer" style="flex:1"></span><div style="text-align:end"><div class="g-px '+k+'">'+fmn(a.px)+'</div><div class="g-chg '+k+'">'+pct(a.chg)+'</div></div></div>'
    +'<div class="g-score"><span>التقييم الذهبي</span><div class="bar"><div class="fill" style="width:'+score+'%;background:'+scoreColor+'"></div></div><span class="val">'+score+'/100</span></div>'
    +'<div class="g-indicators">'
    +'<div class="g-ind"><div class="label">RSI</div><div class="value '+(a.rsi>=70?"down":a.rsi<=30?"up":"neutral")+'">'+(a.rsi?a.rsi.toFixed(0):"—")+'</div></div>'
    +'<div class="g-ind"><div class="label">متوسط 20</div><div class="value '+(a.px>a.s20?"up":"down")+'">'+(a.s20?fmn(a.s20):"—")+'</div></div>'
    +'<div class="g-ind"><div class="label">متوسط 50</div><div class="value '+(a.px>a.s50?"up":"down")+'">'+(a.s50?fmn(a.s50):"—")+'</div></div>'
    +'<div class="g-ind"><div class="label">متوسط 200</div><div class="value '+(a.px>a.s200?"up":"down")+'">'+(a.s200?fmn(a.s200):"—")+'</div></div>'
    +'<div class="g-ind"><div class="label">ATR</div><div class="value neutral">'+(a.atr?a.atr.toFixed(2):"—")+'</div></div>'
    +'<div class="g-ind"><div class="label">تقلب</div><div class="value neutral">'+(a.vola?a.vola.toFixed(1):"—")+'%</div></div>'
    +'<div class="g-ind"><div class="label">حجم/متوسط</div><div class="value '+(a.vol>a.vAvg*1.5?"up":"neutral")+'">'+(a.vAvg?(a.vol/a.vAvg).toFixed(1)+"x":"—")+'</div></div>'
    +'<div class="g-ind"><div class="label">أعلى 52</div><div class="value neutral">'+(a.hi52?fmn(a.hi52):"—")+'</div></div>'
    +'</div>'
    +'<div class="g-analysis"><h3>📊 التحليل الفني</h3><ul>'+scoreData.reasons.map(r=>"<li>"+r+"</li>").join("")+'</ul>'
    +'<h3>🎯 خطة الاستثمار</h3><div class="g-plan">'
    +'<div class="cell entry"><span>الدخول</span><b>'+fmn(a.px)+'</b></div>'
    +'<div class="cell stop"><span>وقف الخسارة</span><b>'+fmn(stop)+'</b></div>'
    +'<div class="cell target"><span>الهدف الأول (3 شهور)</span><b>'+fmn(t1)+'</b></div>'
    +'<div class="cell target"><span>الهدف الثاني (6 شهور)</span><b>'+fmn(t2)+'</b></div>'
    +'<div class="cell"><span>عائد/مخاطرة</span><b>'+rr+':1</b></div>'
    +'</div></div></div>';
}

async function load(){
  document.getElementById("list").innerHTML='<div class="skel"></div>'.repeat(3);
  document.getElementById("foot").textContent="";
  try{
    const rows=await fetchMarket();
    const bySym={};
    rows.forEach(d=>{bySym[d.s.replace("EGX:","")]=d});
    const data=BLUE_CHIPS.filter(t=>bySym[t]).map(t=>tvItem(t,bySym[t].d));
    const analyzed=data.map(a=>{const scoreData=goldenScore(a);return{a,scoreData}});
    analyzed.sort((a,b)=>b.scoreData.score-a.scoreData.score);
    const top5=analyzed.slice(0,5);
    document.getElementById("list").innerHTML=top5.map((item,i)=>cardHTML(item.a,i+1,item.scoreData)).join("");
    const t=new Date(Date.now()+3*3600000).toISOString().slice(11,16);
    document.getElementById("stamp").textContent="آخر تحديث "+t+" بتوقيت القاهرة";
    document.getElementById("foot").textContent="تحليل آلي مبني على مؤشرات فنية وأساسية — ليس نصيحة استثمارية. الاستثمار طويل الأمد يتطلب صبر وإدارة مخاطر.";
  }catch(e){
    document.getElementById("list").innerHTML="";
    document.getElementById("foot").textContent="تعذر تحميل البيانات — راجع الاتصال بالإنترنت ثم اضغط تحديث.";
  }
}
document.getElementById("reload").addEventListener("click",load);
load();
// Auto-refresh every 5 minutes
setInterval(load,5*60*1000);
</script>
</body>
</html>
